apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helloserver
  template:
    metadata:
      labels:
        app: helloserver
    spec:
      containers:
        - name: helloserver
          image: python:3.12-slim
          command: ["python3", "-u", "-c"]
          args:
            - |
              import socket;
              s=socket.socket();s.bind(('',8080));s.listen();
              print('listening');c,a=s.accept();
              c.send(b'HTTP/1.1 200 OK\r\n\r\nHello, World!');c.close()
          ports:
            - containerPort: 8080
